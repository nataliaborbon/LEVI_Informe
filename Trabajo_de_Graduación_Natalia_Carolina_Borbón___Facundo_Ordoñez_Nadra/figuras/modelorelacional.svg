<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="455" viewBox="0 0 1370 455" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1370" height="455" fill="#FFFFFF"/>

  <!-- ============ TABLA 1: Usuarios ============ -->
  <path d="M175,62 v-10 h475 v10" fill="none" stroke="#C0392B" stroke-width="2"/>
  <text x="412" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#C0392B">Tabla (relación)</text>

  <rect x="175" y="72" width="475" height="46" fill="#2F3E4E"/>
  <text x="412" y="103" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Usuarios</text>

  <rect x="175" y="118" width="145" height="62" fill="#FFF1C9"/>
  <rect x="320" y="118" width="135" height="62" fill="#E9EEF3"/>
  <rect x="455" y="118" width="195" height="62" fill="#E9EEF3"/>
  <text x="247" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#7A5800">🔑 id_usuario</text>
  <text x="247" y="169" text-anchor="middle" font-size="15" fill="#7A5800" font-style="italic">INTEGER · PK</text>
  <text x="387" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">nombre</text>
  <text x="387" y="169" text-anchor="middle" font-size="15" fill="#4B5563" font-style="italic">TEXT</text>
  <text x="552" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">email</text>
  <text x="552" y="169" text-anchor="middle" font-size="15" fill="#4B5563" font-style="italic">TEXT</text>

  <rect x="175" y="180" width="145" height="126" fill="#FFF8E4"/>
  <rect x="320" y="180" width="330" height="126" fill="#FFFFFF"/>
  <g font-size="18" fill="#1F2937" text-anchor="middle">
    <text x="247" y="207">1</text><text x="387" y="207">Ana</text><text x="552" y="207">ana@mail.com</text>
    <text x="247" y="249">2</text><text x="387" y="249">Bruno</text><text x="552" y="249">bruno@mail.com</text>
    <text x="247" y="291">3</text><text x="387" y="291">Carla</text><text x="552" y="291">carla@mail.com</text>
  </g>

  <g stroke="#9CA3AF" stroke-width="1" fill="none">
    <rect x="175" y="72" width="475" height="234" stroke="#2F3E4E" stroke-width="2"/>
    <line x1="175" y1="180" x2="650" y2="180" stroke-width="2"/>
    <line x1="175" y1="222" x2="650" y2="222"/>
    <line x1="175" y1="264" x2="650" y2="264"/>
    <line x1="320" y1="118" x2="320" y2="306"/>
    <line x1="455" y1="118" x2="455" y2="306"/>
  </g>

  <!-- Columna -->
  <rect x="323" y="121" width="129" height="182" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5" rx="4"/>
  <line x1="387" y1="306" x2="387" y2="330" stroke="#C0392B" stroke-width="2"/>
  <text x="387" y="353" text-anchor="middle" font-size="20" font-weight="600" fill="#C0392B">Columna</text>
  <text x="387" y="375" text-anchor="middle" font-size="17" fill="#C0392B">(campo / atributo)</text>

  <!-- Fila -->
  <rect x="169" y="225" width="487" height="36" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5" rx="4"/>
  <line x1="122" y1="243" x2="165" y2="243" stroke="#C0392B" stroke-width="2" marker-end="url(#ar)"/>
  <text x="115" y="238" text-anchor="end" font-size="20" font-weight="600" fill="#C0392B">Fila</text>
  <text x="115" y="260" text-anchor="end" font-size="17" fill="#C0392B">(registro /</text>
  <text x="115" y="280" text-anchor="end" font-size="17" fill="#C0392B">tupla)</text>

  <!-- ============ TABLA 2: Registros ============ -->
  <path d="M700,62 v-10 h470 v10" fill="none" stroke="#C0392B" stroke-width="2"/>
  <text x="935" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#C0392B">Tabla (relación)</text>

  <rect x="700" y="72" width="470" height="46" fill="#2F3E4E"/>
  <text x="935" y="103" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Registros</text>

  <rect x="700" y="118" width="145" height="62" fill="#FFF1C9"/>
  <rect x="845" y="118" width="150" height="62" fill="#E9EEF3"/>
  <rect x="995" y="118" width="175" height="62" fill="#DCE8FF"/>
  <text x="772" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#7A5800">🔑 id_registro</text>
  <text x="772" y="169" text-anchor="middle" font-size="15" fill="#7A5800" font-style="italic">INTEGER · PK</text>
  <text x="920" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">fecha</text>
  <text x="920" y="169" text-anchor="middle" font-size="15" fill="#4B5563" font-style="italic">DATE</text>
  <text x="1082" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#1E40AF">🔗 id_usuario</text>
  <text x="1082" y="169" text-anchor="middle" font-size="15" fill="#1E40AF" font-style="italic">INTEGER · FK</text>

  <rect x="700" y="180" width="145" height="126" fill="#FFF8E4"/>
  <rect x="845" y="180" width="150" height="126" fill="#FFFFFF"/>
  <rect x="995" y="180" width="175" height="126" fill="#EEF4FF"/>
  <g font-size="18" fill="#1F2937" text-anchor="middle">
    <text x="772" y="207">101</text><text x="920" y="207">2026-03-02</text><text x="1082" y="207">1</text>
    <text x="772" y="249">102</text><text x="920" y="249">2026-03-02</text><text x="1082" y="249">3</text>
    <text x="772" y="291">103</text><text x="920" y="291">2026-03-05</text><text x="1082" y="291">1</text>
  </g>

  <g stroke="#9CA3AF" stroke-width="1" fill="none">
    <rect x="700" y="72" width="470" height="234" stroke="#2F3E4E" stroke-width="2"/>
    <line x1="700" y1="180" x2="1170" y2="180" stroke-width="2"/>
    <line x1="700" y1="222" x2="1170" y2="222"/>
    <line x1="700" y1="264" x2="1170" y2="264"/>
    <line x1="845" y1="118" x2="845" y2="306"/>
    <line x1="995" y1="118" x2="995" y2="306"/>
  </g>

  <!-- Esquema -->
  <rect x="697" y="152" width="476" height="26" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5" rx="4"/>
  <line x1="1222" y1="165" x2="1178" y2="165" stroke="#C0392B" stroke-width="2" marker-end="url(#ar)"/>
  <text x="1230" y="158" font-size="20" font-weight="600" fill="#C0392B">Esquema</text>
  <text x="1230" y="180" font-size="17" fill="#C0392B">(tipo de dato</text>
  <text x="1230" y="200" font-size="17" fill="#C0392B">de cada</text>
  <text x="1230" y="220" font-size="17" fill="#C0392B">columna)</text>

  <!-- Relación PK ← FK -->
  <path d="M1082,306 V420 H247 V314" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arb)"/>
  <rect x="452" y="401" width="420" height="38" rx="19" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="662" y="427" text-anchor="middle" font-size="20" font-weight="600" fill="#1E40AF">Integridad referencial: FK → PK</text>

  <text x="235" y="353" text-anchor="end" font-size="20" font-weight="600" fill="#7A5800">Clave primaria</text>
  <text x="235" y="375" text-anchor="end" font-size="17" fill="#7A5800">(Primary Key)</text>
  <text x="1094" y="353" font-size="20" font-weight="600" fill="#1E40AF">Clave foránea</text>
  <text x="1094" y="375" font-size="17" fill="#1E40AF">(Foreign Key)</text>
</svg>
